# Use the terminal's ANSI palette so the same theme follows light and dark mode.
colourful: true

filekinds:
  normal: {foreground: Default}
  directory: {foreground: Blue, is_bold: true}
  symlink: {foreground: Cyan}
  pipe: {foreground: DarkGray}
  block_device: {foreground: Red}
  char_device: {foreground: Red}
  socket: {foreground: Purple}
  special: {foreground: Purple}
  executable: {foreground: Green, is_bold: true}
  mount_point: {foreground: Cyan, is_underline: true}

perms:
  user_read: {foreground: Red, is_bold: true}
  user_write: {foreground: Yellow, is_bold: true}
  user_execute_file: {foreground: Green, is_bold: true}
  user_execute_other: {foreground: Green, is_bold: true}
  group_read: {foreground: Red}
  group_write: {foreground: Yellow}
  group_execute: {foreground: Green}
  other_read: {foreground: Red}
  other_write: {foreground: Yellow}
  other_execute: {foreground: Green}
  special_user_file: {foreground: Purple}
  special_other: {foreground: DarkGray}
  attribute: {foreground: DarkGray}

size:
  major: {foreground: DarkGray}
  minor: {foreground: Cyan}
  number_byte: {foreground: Default}
  number_kilo: {foreground: DarkGray}
  number_mega: {foreground: Blue}
  number_giga: {foreground: Purple}
  number_huge: {foreground: Purple, is_bold: true}
  unit_byte: {foreground: DarkGray}
  unit_kilo: {foreground: Cyan}
  unit_mega: {foreground: Purple}
  unit_giga: {foreground: Purple}
  unit_huge: {foreground: Cyan}

users:
  user_you: {foreground: Default}
  user_root: {foreground: Red, is_bold: true}
  user_other: {foreground: Red}
  group_yours: {foreground: DarkGray}
  group_other: {foreground: DarkGray, is_dimmed: true}
  group_root: {foreground: Red}

links:
  normal: {foreground: Blue}
  multi_link_file: {foreground: Blue, is_bold: true}

git:
  new: {foreground: Green}
  modified: {foreground: Yellow}
  deleted: {foreground: Red}
  renamed: {foreground: Cyan}
  typechange: {foreground: Purple}
  ignored: {foreground: DarkGray, is_dimmed: true}
  conflicted: {foreground: Red, is_bold: true}

git_repo:
  branch_main: {foreground: DarkGray}
  branch_other: {foreground: Purple}
  git_clean: {foreground: Green}
  git_dirty: {foreground: Red}

security_context:
  none: {foreground: DarkGray}
  selinux:
    colon: {foreground: DarkGray, is_dimmed: true}
    user: {foreground: DarkGray}
    role: {foreground: Purple}
    typ: {foreground: Blue}
    range: {foreground: Purple}

file_type:
  image: {foreground: Yellow}
  video: {foreground: Red}
  music: {foreground: Green}
  lossless: {foreground: Cyan}
  crypto: {foreground: DarkGray}
  document: {foreground: Default}
  compressed: {foreground: Purple}
  temp: {foreground: Red, is_dimmed: true}
  compiled: {foreground: Cyan}
  build: {foreground: Yellow, is_underline: true}
  source: {foreground: Blue}

punctuation: {foreground: DarkGray, is_dimmed: true}
date: {foreground: Yellow}
inode: {foreground: DarkGray}
blocks: {foreground: DarkGray, is_dimmed: true}
header: {foreground: Default, is_bold: true, is_underline: true}
octal: {foreground: Cyan}
flags: {foreground: Purple}

symlink_path: {foreground: Cyan}
control_char: {foreground: Blue}
broken_symlink: {foreground: Red, is_bold: true}
broken_path_overlay: {is_underline: true}
