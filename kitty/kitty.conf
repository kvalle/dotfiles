# Kitty Configuration
# Docs: https://sw.kovidgoyal.net/kitty/conf.html

# Font
# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size        18
modify_font      cell_height 10px

# Window
window_padding_width  12
inactive_text_alpha   1.0

# macOS options
macos_option_as_alt no
macos_titlebar_color background

# Cursor
cursor_shape      underline
cursor_shape_unfocused unchanged
cursor_blink_interval 0.7
shell_integration no-cursor

# Mouse
mouse_hide_wait   0
copy_on_select    clipboard

# Bell
enable_audio_bell no

# Scrollback
scrollback_lines  10000
scrollback_pager  bat --paging=always --style=plain

# URLs
open_url_with default

# Cmd+click to open links (like iTerm2/Ghostty). Kitty's default is plain
# left-click or ctrl+shift+click, which conflicts with TUI apps like OpenCode
# that consume plain clicks. Cmd+click works in both ungrabbed and grabbed mode.
mouse_map super+left click ungrabbed mouse_handle_click link
mouse_map super+left click grabbed  mouse_handle_click link

# Tabs
tab_bar_style     powerline
tab_powerline_style slanted
map cmd+t          new_tab_with_cwd
map cmd+w          close_window
map alt+cmd+left      previous_tab
map alt+cmd+right     next_tab
map cmd+1          goto_tab 1
map cmd+2          goto_tab 2
map cmd+3          goto_tab 3
map cmd+4          goto_tab 4
map cmd+5          goto_tab 5
map cmd+6          goto_tab 6
map cmd+7          goto_tab 7
map cmd+8          goto_tab 8
map cmd+9          goto_tab 9

# Splits
map cmd+d          launch --location=hsplit
map cmd+shift+d    launch --location=vsplit
map ctrl+cmd+left   neighboring_window left
map ctrl+cmd+right  neighboring_window right
map ctrl+cmd+up     neighboring_window up
map ctrl+cmd+down   neighboring_window down

# Font size (override Kitty's default ±2 to match Ghostty's ±1)
map cmd+=          change_font_size all +1.0
map cmd+-          change_font_size all -1.0
map cmd+0          change_font_size all 0

# Forward delete (fn+backspace on Mac keyboards)
map fn+delete      send_key delete

# Claude Code in the sandbox does not negotiate Kitty's modified Enter input.
map shift+enter    send_text all \x1b[13;2u
