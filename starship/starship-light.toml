# Generated by scripts/generate-starship-configs.rb. Do not edit directly.
# Starship prompt configuration for Everforest Light Contrast
# Docs: https://starship.rs/config/

command_timeout = 1000
palette = "everforest_light_contrast"
add_newline = true

format = """
$directory\
([░▒▓](fg:maroon_surface bg:teal_surface)$git_branch$git_status$git_state[ ](bg:maroon_surface)[](fg:maroon_surface) )\
$python\
${custom.uv_python}\
$java\
$nodejs\
$kotlin\
$kubernetes\
$azure\
$hostname\
$shlvl\
$jobs\
$status\
$cmd_duration\
$line_break\
$character"""

right_format = "$battery"

[character]
format = "$symbol "
success_symbol = "[❯](bold teal)"
error_symbol = "[❯](bold maroon)"

[directory]
truncation_length = 0
truncate_to_repo = true
format = "[](fg:teal_surface)[ 󰉋 $path$read_only ]($style)[](fg:teal_surface) "
repo_root_format = "[](fg:teal_surface)[ 󰉋 $before_root_path$repo_root$path$read_only ]($style)"
style = "bold fg:teal bg:teal_surface"
repo_root_style = "bold fg:teal bg:teal_surface"

[git_branch]
format = "[ $symbol$branch(:$remote_branch)]($style)"
symbol = " "
style = "bold fg:maroon bg:maroon_surface"

[git_status]
format = '([ $all_status$ahead_behind]($style))'
style = "bold fg:red bg:maroon_surface"
conflicted = "≠"
ahead = "↑"
behind = "↓"
diverged = "↕"
up_to_date = ""
untracked = "?"
stashed = '\$'
modified = "•"
staged = "+"
renamed = "→"
deleted = "×"
typechanged = "~"

[git_state]
format = "[ $state( $progress_current/$progress_total)]($style)"
style = "bold fg:maroon bg:maroon_surface"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "󰅙 "
style = "red"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "lavender"

[shlvl]
disabled = false
threshold = 3
format = "[󰆍↳]($style) "
style = "cyan"

[jobs]
format = "[&·$number]($style) "
number_threshold = 1
style = "cyan"

[cmd_duration]
min_time = 2000
format = "[󰔟 $duration]($style) "
style = "yellow"

[battery]
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 40
style = "red"

[python]
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
style = "peach"

[custom.uv_python]
command = '''
dir=$PWD
git_root=$(git rev-parse --show-toplevel 2>/dev/null)

while true; do
  if [[ -f "$dir/uv.lock" ]]; then
    uv_version=$(uv python find --project "$dir" --show-version --no-python-downloads) || exit 1

    # Starship's Python module only scans the current directory. Fill in its
    # output when an uv project was found through an ancestor directory.
    python_module_active=false
    [[ -n "$VIRTUAL_ENV" ]] && python_module_active=true
    for marker in requirements.txt .python-version pyproject.toml Pipfile tox.ini setup.py __init__.py; do
      [[ -f "$PWD/$marker" ]] && python_module_active=true
    done
    python_files=($PWD/*.(py|ipynb)(N))
    (( $#python_files > 0 )) && python_module_active=true

    if $python_module_active; then
      print -r -- "(uv → $uv_version)"
    else
      for python_command in python python3 python2; do
        if command -v "$python_command" >/dev/null; then
          global_version=$($python_command --version 2>&1)
          print -r -- " v${global_version#Python } (uv → $uv_version)"
          break
        fi
      done
    fi
    exit
  fi

  [[ "$dir" == "$git_root" || "$dir" == / ]] && exit 1
  dir=${dir:h}
done
'''
when = true
format = '[$output](peach) '
shell = ["zsh", "--no-rcs"]

[java]
format = '[${symbol}(${version} )]($style)'
symbol = " "
style = "peach"

[nodejs]
format = '[${symbol}(${version})]($style)([ \(!= $engines_version\)](red)) '
symbol = "󰎙 "
style = "peach"
not_capable_style = "peach"

[kotlin]
symbol = " "
style = "peach"
format = '[${symbol}(${version} )]($style)'

[kubernetes]
disabled = true
format = '[$symbol$context( \($namespace\))]($style) '

[azure]
disabled = true
format = '[$symbol($subscription)]($style) '

[palettes.everforest_light_contrast]
red = "#ad3430"
maroon = "#b83e37"
peach = "#b34d08"
yellow = "#986500"
green = "#606d00"
teal = "#187252"
cyan = "#32618b"
blue = "#32618b"
lavender = "#9d397c"
crust = "#3d413d"
mantle = "#50564f"
teal_surface = "#e4e8bd"
maroon_surface = "#f8d4ca"
