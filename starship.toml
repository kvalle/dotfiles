# Starship prompt configuration
# Docs: https://starship.rs/config/

# Timeout for commands (ms)
command_timeout = 1000
palette = "catppuccin_macchiato"

# Newline between prompt lines
add_newline = true

# Prompt format
format = """
$directory\
([░▒▓](fg:maroon bg:teal)$git_branch$git_status$git_state[ ](bg:maroon)[](fg:maroon) )\
$python\
${custom.uv_python}\
$java\
$nodejs\
$kotlin\
$kubernetes\
$azure\
$hostname\
$shlvl\
$jobs\
$status\
$cmd_duration\
$line_break\
$character"""

right_format = "$battery"

[character]
format = "$symbol "
success_symbol = "[❯](bold teal)"
error_symbol = "[❯](bold maroon)"

[directory]
truncation_length = 0
truncate_to_repo = true
format = "[](fg:teal)[ 󰉋 $path$read_only ]($style)[](fg:teal) "
repo_root_format = "[](fg:teal)[ 󰉋 $before_root_path$repo_root$path$read_only ]($style)"
style = "bold fg:crust bg:teal"
repo_root_style = "bold fg:crust bg:teal"

[git_branch]
format = "[ $symbol$branch(:$remote_branch)]($style)"
symbol = " "
style = "bold fg:crust bg:maroon"

[git_status]
format = '([ $all_status$ahead_behind]($style))'
style = "bold fg:crust bg:maroon"
conflicted = "≠"
ahead = "↑"
behind = "↓"
diverged = "↕"
up_to_date = ""
untracked = "?"
stashed = '\$'
modified = "•"
staged = "+"
renamed = "→"
deleted = "×"
typechanged = "~"

[git_state]
format = "[ $state( $progress_current/$progress_total)]($style)"
style = "bold fg:mantle bg:maroon"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "󰅙 "
style = "dimmed red"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "dimmed lavender"

[shlvl]
disabled = false
threshold = 3
format = "[󰆍↳]($style) "
style = "dimmed cyan"

[jobs]
format = "[&·$number]($style) "
number_threshold = 1
style = "dimmed cyan"

[cmd_duration]
min_time = 2000
format = "[󰔟 $duration]($style) "
style = "dimmed yellow"

[battery]
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 40
style = "dimmed red"

[python]
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
style = "dimmed peach"

[custom.uv_python]
command = '''
dir=$PWD
git_root=$(git rev-parse --show-toplevel 2>/dev/null)

while true; do
  if [[ -f "$dir/uv.lock" ]]; then
    uv_version=$(uv python find --project "$dir" --show-version --no-python-downloads) || exit 1

    # Starship's Python module only scans the current directory. Fill in its
    # output when an uv project was found through an ancestor directory.
    python_module_active=false
    [[ -n "$VIRTUAL_ENV" ]] && python_module_active=true
    for marker in requirements.txt .python-version pyproject.toml Pipfile tox.ini setup.py __init__.py; do
      [[ -f "$PWD/$marker" ]] && python_module_active=true
    done
    python_files=($PWD/*.(py|ipynb)(N))
    (( $#python_files > 0 )) && python_module_active=true

    if $python_module_active; then
      print -r -- "(uv → $uv_version)"
    else
      for python_command in python python3 python2; do
        if command -v "$python_command" >/dev/null; then
          global_version=$($python_command --version 2>&1)
          print -r -- " v${global_version#Python } (uv → $uv_version)"
          break
        fi
      done
    fi
    exit
  fi

  [[ "$dir" == "$git_root" || "$dir" == / ]] && exit 1
  dir=${dir:h}
done
'''
when = true
format = '[$output](dimmed peach) '
shell = ["zsh", "--no-rcs"]

[java]
format = '[${symbol}(${version} )]($style)'
symbol = " "
style = "dimmed peach"

[nodejs]
format = '[${symbol}(${version})]($style)([ \(!= $engines_version\)](dimmed red)) '
symbol = "󰎙 "
style = "dimmed peach"
not_capable_style = "dimmed peach"

[kotlin]
symbol = " "
style = "dimmed peach"
format = '[${symbol}(${version} )]($style)'

[kubernetes]
disabled = true
format = '[$symbol$context( \($namespace\))]($style) '

[azure]
disabled = true
format = '[$symbol($subscription)]($style) '

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
