promptToReturnFromSubprocess: false
gui:
  nerdFontsVersion: "3"
  switchTabsWithPanelJumpKeys: true
  # Catppuccin Macchiato is the dark-mode base. Light-mode files override it.
  theme:
    activeBorderColor:
      - '#8aadf4'
      - bold
    inactiveBorderColor:
      - '#a5adcb'
    searchingActiveBorderColor:
      - '#eed49f'
    optionsTextColor:
      - '#8aadf4'
    selectedLineBgColor:
      - '#363a4f'
    inactiveViewSelectedLineBgColor:
      - '#6e738d'
    cherryPickedCommitFgColor:
      - '#8aadf4'
    cherryPickedCommitBgColor:
      - '#494d64'
    markedBaseCommitFgColor:
      - '#8aadf4'
    markedBaseCommitBgColor:
      - '#eed49f'
    unstagedChangesColor:
      - '#ed8796'
    defaultFgColor:
      - '#cad3f5'
  authorColors:
    '*': '#b7bdf8'
git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
