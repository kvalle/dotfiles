# cplt global config — AI agent sandbox
# Docs: https://github.com/navikt/cplt/blob/main/docs/configuration.md

[sandbox]
agent = "opencode"
quiet = true
yes = true
allow_gpg_signing = false
allow_cache_exec = ["gradle"]
pass_env = ["GH_TOKEN"]

# ~/dotfiles/git is symlinked from ~/.config/git — cplt must be able to read the original
# ~/dotfiles/ai/opencode is symlinked from ~/.config/opencode/opencode.jsonc
# ~/.claude/skills and ~/.agents/skills — agent skills (real directories)
# ~/.agents/.skill-lock.json — used to verify ai/skills.txt
# ~/Library/Application Support/tldraw — the tldraw-offline skill reads server.json
# The Nix profile points on to packages and libraries under /nix/store
[allow]
read = ["~/dotfiles/git", "~/dotfiles/ai/opencode", "~/.claude/skills", "~/.agents/skills", "~/.agents/.skill-lock.json", "~/Library/Application Support/tldraw", "~/.local/state/nix/profiles/dotfiles", "/nix/store"]
localhost = [7236]

[proxy]
enabled = true
log_level = "none"
log_file = "~/.config/cplt/proxy.log"

[gh_guard]
enabled = true
mode = "block"
allow_api_write = false

[git_guard]
enabled = true
protect_default_branch_only = true
