# cplt global config — AI agent sandbox
# Docs: https://github.com/navikt/cplt/blob/main/docs/configuration.md

[sandbox]
agent = "opencode"
quiet = true
yes = true
allow_gpg_signing = false
allow_cache_exec = ["gradle"]
pass_env = ["GH_TOKEN"]

# ~/dotfiles/git er symlinket fra ~/.config/git — cplt må kunne lese originalen
# ~/dotfiles/ai/opencode er symlinket fra ~/.config/opencode/opencode.jsonc
# ~/.claude/skills og ~/.agents/skills — agent skills (ekte kataloger)
# ~/.agents/.skill-lock.json — brukes til å verifisere ai/skills.txt
# ~/Library/Application Support/tldraw — tldraw-offline skill leser server.json
# ~/skills — kanonisk kopi for npx skills (bl.a. tldraw tq-helper)
[allow]
read = ["~/dotfiles/git", "~/dotfiles/ai/opencode", "~/.claude/skills", "~/.agents/skills", "~/.agents/.skill-lock.json", "~/Library/Application Support/tldraw", "~/skills"]
localhost = [7236]

[proxy]
enabled = true
log_level = "none"
log_file = "~/.config/cplt/proxy.log"

[gh_guard]
enabled = true
mode = "block"
allow_api_write = false

[git_guard]
enabled = true
protect_default_branch_only = true
