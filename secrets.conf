# Secrets-konfigurasjon for dotfiles
# Format: målfil  op-referanse
#   målfil        filnavn uten katalog; katalogen er SECRETS_DIR i
#                 scripts/secrets/common.sh
#   op-referanse  op://<vault>/<oppføring>/<felt>
# op-referansen står sist fordi den kan inneholde mellomrom: alt etter det
# første feltet leses som én referanse.
# Katalogen opprettes med modus 700, og hver fil skrives med modus 600.
# 1Password-kontoen står samme sted som katalogen og er felles for alle
# oppføringene.
# Fjernes en linje herfra, blir filen liggende igjen i katalogen.
# `scripts/verify.sh secrets` varsler om filer som ikke står her.

digipost-github-secret  op://Private/Digipost GitHub secret/password
