# Secrets configuration for dotfiles
# Format: target  op-reference
#   target        file name without a directory; the directory is SECRETS_DIR in
#                 scripts/secrets/common.sh
#   op-reference  op://<vault>/<entry>/<field>
# The op reference comes last because it can contain spaces: everything after
# the first field is read as one reference.
# The directory is created with mode 700, and each file is written with mode 600.
# The 1Password account is defined in the same place as the directory and is
# shared by all entries.
# Remove a line from here and the file is left behind in the directory.
# `scripts/verify.sh secrets` warns about files that are not listed here.

digipost-github-secret  op://Private/Digipost GitHub secret/password
