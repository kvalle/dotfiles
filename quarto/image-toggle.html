<!-- Included by quarto/markdown.yml. Clicking an image in the document body
     toggles a wide mode that lets it grow beyond the text column. -->
<script>
document.querySelectorAll("#quarto-document-content img").forEach((img) => {
  img.classList.add("md-image-toggle");
  img.addEventListener("click", () => img.classList.toggle("md-image-wide"));
});
</script>
