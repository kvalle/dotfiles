# Symlink configuration for dotfiles
# Format: type  source  destination
#   d = directory symlink
#   f = file symlink
# mkdir -p is always run for the destination's parent directory.
# Correct symlinks are kept and broken symlinks are replaced automatically.
# Wrong symlinks, regular files and directories are overwritten only after
# confirmation, or without confirmation when setup.sh receives --force.
# Remove a line from here and the old symlink is left in the home directory
# until it is cleaned up with scripts/symlinks/setup.sh --prune.
# All source paths are relative to ~/dotfiles/

# Shell, history, prompt and help text
f  hushlogin                  ~/.hushlogin
f  zsh/zprofile               ~/.zprofile
f  zsh/zshrc                  ~/.zshrc
d  atuin                      ~/.config/atuin
f  starship/starship.toml     ~/.config/starship.toml
d  tealdeer                   ~/.config/tealdeer

# Terminal emulators
d  ghostty                    ~/.config/ghostty
d  kitty                      ~/.config/kitty

# Git
d  git                        ~/.config/git
d  lazygit                    ~/.config/lazygit

# Languages and REPLs
f  python/pythonrc.py         ~/.config/python/pythonrc.py
f  ghci/ghci.conf             ~/.config/ghci/ghci.conf

# File navigation and content viewing
d  bat                        ~/.config/bat
d  eza                        ~/.config/eza
f  glow/glow.yml              ~/Library/Preferences/glow/glow.yml
f  superfile/config.toml      ~/Library/Application Support/superfile/config.toml
f  superfile/hotkeys.toml     ~/Library/Application Support/superfile/hotkeys.toml
f  superfile/theme/everforest-light-contrast.toml  ~/Library/Application Support/superfile/theme/everforest-light-contrast.toml
f  superfile/theme/catppuccin-macchiato.toml  ~/Library/Application Support/superfile/theme/catppuccin-macchiato.toml

# System monitoring
d  btop                       ~/.config/btop

# Task management
d  tuxedo                     ~/.config/tuxedo

# App launchers
f  tuna/config.toml           ~/Library/Application Support/Tuna/config.toml
f  tuna/scripts/light-switch  ~/Library/Scripts/light-switch

# AI agents and sandbox
f  cplt/config.toml           ~/.config/cplt/config.toml
# Stable alias so cplt's allow.read can name ai/opencode without hardcoding the
# repo location: cplt canonicalizes allow paths, so this resolves into the repo.
# ~/.config/opencode cannot be used — it is a real directory (opencode writes
# there), holding the per-file symlinks below rather than being one itself.
d  ai/opencode               ~/.config/cplt/opencode-config
f  ai/opencode/opencode.jsonc  ~/.config/opencode/opencode.jsonc
f  ai/opencode/tui.jsonc      ~/.config/opencode/tui.jsonc
f  ai/opencode/INSTRUCTIONS.md  ~/.config/opencode/INSTRUCTIONS.md
d  ai/opencode/themes         ~/.config/opencode/themes
f  ai/claude/settings.json    ~/.claude/settings.json
f  ai/claude/statusline-command.sh  ~/.claude/statusline-command.sh
f  ai/claude/CLAUDE.md        ~/.claude/CLAUDE.md

# Browsers
# Zen Browser is special-cased in scripts/symlinks/setup.sh because of its dynamic profile path.
